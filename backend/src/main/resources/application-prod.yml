spring:
  datasource:
    url: ${JDBC_DATABASE_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    vectorstore:
      type: pgvector
      pgvector:
        initialize-schema: true
        dimensions: ${VECTOR_DIMENSIONS:1536}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
